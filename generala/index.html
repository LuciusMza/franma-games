<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#27ae60">
    <title>Generala FranMa</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg: #2c3e50; --felt: #27ae60; --dice: #ecf0f1; --dot: #2c3e50; --gold: #f1c40f; --purple: #9b59b6; --red: #e74c3c; }
        * { box-sizing: border-box; touch-action: manipulation; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body { margin: 0; height: 100dvh; background: var(--bg); font-family: 'Roboto', sans-serif; display: flex; flex-direction: column; overflow: hidden; color: white; }

        /* PANTALLAS */
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; position: absolute; top:0; left:0; z-index: 10; background: var(--bg); }
        .active { display: flex; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(0,0,0,0.4); border-radius: 15px; margin-bottom: 5px; flex-shrink: 0; width: 95%; margin-top: 10px; }
        .turn-badge { background: #2c3e50; padding: 5px 15px; border-radius: 20px; font-weight: bold; border: 1px solid #7f8c8d; max-width: 160px; display: flex; align-items: center; gap: 5px; }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .btn-mini { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 8px; width: 40px; height: 40px; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* ZONA DADOS */
        #dice-zone { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; width: 100%; }
        .dice-container { display: flex; justify-content: center; gap: 12px; margin: 20px 0; perspective: 1000px; flex-wrap: wrap; width: 100%; }
        
        /* DADO INDESTRUCTIBLE (CSS FIXED) */
        .die { 
            width: 60px; height: 60px; 
            background: #ecf0f1; 
            border-radius: 12px; 
            border: 2px solid #bdc3c7;
            box-shadow: 0 5px 0 #95a5a6, 0 10px 10px rgba(0,0,0,0.3);
            display: grid; 
            /* GRILLA DE 3x3 FIJA */
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            padding: 4px; 
            cursor: pointer; 
            transition: transform 0.1s; 
            position: relative; 
        }
        
        /* Los puntos se posicionan directamente por su clase en JS */
        .dot { 
            width: 10px; height: 10px; 
            background: #2c3e50; 
            border-radius: 50%; 
            align-self: center; justify-self: center; 
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
        }
        
        .die.held { transform: translateY(-10px); box-shadow: 0 15px 0 #95a5a6, 0 25px 25px rgba(0,0,0,0.3); border-color: var(--gold); }
        .die.held::after { content: '🔒'; position: absolute; bottom: -35px; left: 50%; transform: translateX(-50%); font-size: 16px; color: var(--gold); text-shadow: 0 2px 2px black; }
        .die.rolling { animation: shake 0.5s infinite; pointer-events: none; }
        .die.flip-target { border-color: var(--purple); animation: pulse 1s infinite; transform: scale(1.1); box-shadow: 0 0 20px var(--purple); }

        .flip-setup { background: rgba(0,0,0,0.4); padding: 8px 15px; border-radius: 15px; margin-bottom: 5px; margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 5px; border: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; }
        .flip-controls { display: flex; align-items: center; gap: 20px; }
        .btn-inc { width: 35px; height: 35px; border-radius: 50%; border: 2px solid white; background: transparent; color: white; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .flip-val { font-size: 1.8rem; font-weight: bold; font-family: monospace; color: var(--gold); width: 30px; text-align: center; }

        /* PLANILLA */
        #score-sheet { flex: 1; background: #fff; border-radius: 15px 15px 0 0; margin: 0 -10px; display: none; z-index: 40; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); flex-direction: column; overflow: hidden; position: absolute; bottom:0; left:10px; right:10px; top: 70px; }
        #sheet-header { padding: 15px; text-align: center; border-bottom: 1px solid #eee; background: #fff; flex-shrink: 0; }
        #sheet-content { flex: 1; overflow-y: auto; padding: 10px 15px; -webkit-overflow-scrolling: touch; }
        #sheet-footer { padding: 15px; background: #fff; border-top: 1px solid #eee; display: flex; justify-content: center; flex-shrink: 0; }

        .score-row { display: flex; justify-content: space-between; padding: 8px 5px; border-bottom: 1px solid #eee; align-items: center; }
        .cat-name { font-weight: 700; color: #34495e; font-size: 1rem; }
        .cat-btn { background: #ecf0f1; border: 2px solid #bdc3c7; padding: 8px 15px; border-radius: 10px; font-weight: 900; color: #7f8c8d; cursor: pointer; transition: 0.2s; font-size: 1rem; min-width: 50px; }
        .cat-btn.selectable { background: white; color: #3498db; border-color: #3498db; }
        .cat-btn.selected-candidate { background: var(--gold); color: #2c3e50; border-color: #f39c12; transform: scale(1.1); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .cat-btn.filled { background: transparent; border: none; color: #2c3e50; font-size: 1.3rem; cursor: default; }
        .cat-btn.disabled { opacity: 0.4; cursor: default; filter: grayscale(1); }

        .btn-confirm { background: var(--gold); color: #2c3e50; border: none; padding: 12px 40px; border-radius: 30px; font-weight: 900; font-size: 1.1rem; box-shadow: 0 10px 20px rgba(0,0,0,0.2); cursor: pointer; opacity: 0.5; pointer-events: none; transition: 0.3s; }
        .btn-confirm.active { opacity: 1; pointer-events: auto; animation: pulse 1s infinite; }

        /* CONTROLES */
        .controls { display: flex; gap: 10px; justify-content: center; padding: 10px 0; z-index: 50; flex-shrink: 0; min-height: 60px; width: 100%; }
        .btn-roll { background: #e74c3c; width: 100%; max-width: 300px; box-shadow: 0 5px 0 #c0392b; color:white; border:none; padding:15px; border-radius:30px; font-weight:900; font-size:1.2rem; }
        .btn-score { background: #3498db; width: 100%; max-width: 300px; box-shadow: 0 5px 0 #2980b9; color:white; border:none; padding:15px; border-radius:30px; font-weight:900; font-size:1.2rem; }

        #msg-area { text-align:center; color:rgba(255,255,255,0.8); font-size:0.9rem; min-height:20px; margin-bottom:5px; font-weight: bold; display: block; flex-shrink: 0; }
        .msg-alert { color: var(--gold) !important; text-shadow: 0 2px 4px rgba(0,0,0,0.5); font-size: 1.1rem !important; animation: pulse 0.5s infinite; }

        /* HOME ESTILOS */
        .btn { background: var(--gold); color: #2c3e50; border: none; padding: 15px 50px; border-radius: 50px; font-size: 1.5rem; font-weight: 900; box-shadow: 0 8px 0 #c27c0e; cursor: pointer; text-transform: uppercase; margin-top: 20px; }
        .player-count-box { display: flex; gap: 10px; margin-bottom: 20px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 20px; }
        .p-btn { width: 50px; height: 50px; border-radius: 12px; border: 2px solid #555; background: transparent; color: #aaa; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
        .p-btn.selected { background: var(--gold); color: #2c3e50; border-color: var(--gold); box-shadow: 0 0 15px rgba(241, 196, 15, 0.4); transform: scale(1.1); }
        .name-row { display: flex; align-items: center; background: rgba(255,255,255,0.05); border-radius: 10px; padding: 5px 15px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 10px; }
        .name-input { background: transparent; border: none; color: white; padding: 10px; font-size: 1rem; flex: 1; outline: none; }

        /* VERSION TAG */
        .version-tag { position: absolute; bottom: 5px; left: 5px; font-size: 0.7rem; color: rgba(255,255,255,0.3); }

        @keyframes shake { 0% { transform: rotate(5deg); } 50% { transform: rotate(-5deg); } 100% { transform: rotate(5deg); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="screen-home" class="screen active">
        <div style="font-size:4rem;">🎲</div>
        <h1 style="color:#f1c40f; font-size:3rem; margin:0; text-shadow:0 4px 0 #000;">GENERALA</h1>
        <p style="color:#aaa; letter-spacing:2px; margin-bottom:30px;">FRANMA CASINO</p>
        
        <p style="font-size:0.8rem; font-weight:bold; color:#aaa;">JUGADORES</p>
        <div class="player-count-box">
            <button class="p-btn selected" onclick="setPlayers(1, this)">1</button>
            <button class="p-btn" onclick="setPlayers(2, this)">2</button>
            <button class="p-btn" onclick="setPlayers(3, this)">3</button>
            <button class="p-btn" onclick="setPlayers(4, this)">4</button>
        </div>
        
        <div id="names-container" style="width:80%; max-width:300px;">
            <div class="name-row"><span style="color:#f1c40f; font-weight:bold; margin-right:10px;">J1</span><input type="text" class="name-input" id="name-0" value="JUGADOR 1"></div>
        </div>

        <button class="btn" onclick="startGame()">JUGAR</button>
        <div class="version-tag">v6.0 - FINAL</div>
    </div>

    <div id="screen-game" class="screen" style="justify-content: flex-start; background: var(--felt);">
        <div id="game-area">
            <div class="header">
                <div class="turn-badge">👤 <span id="player-name">JUGADOR 1</span></div>
                <div class="header-right"><span id="rolls-info" style="font-weight:bold; color:#ddd;">TIROS: 3</span> <button class="btn-mini" onclick="toggleScoreSheet(true, true)">📊</button></div>
            </div>

            <div id="dice-zone">
                <div class="dice-container" id="dice-rack"></div>
                <div class="flip-setup" id="flip-area">
                    <div style="font-size:0.7rem; text-transform:uppercase; letter-spacing:1px; color:#ddd;">Voy a dar vuelta:</div>
                    <div class="flip-controls">
                        <button class="btn-inc" onclick="adjustFlip(-1)">-</button><div class="flip-val" id="flip-count">0</div><button class="btn-inc" onclick="adjustFlip(1)">+</button>
                    </div>
                </div>
                <div id="msg-area">...</div>
            </div>

            <div id="score-sheet">
                <div id="sheet-header"><h3 id="sheet-title" style="margin:0; color:#333;">JUGADOR 1</h3></div>
                <div id="sheet-content"></div>
                <div id="sheet-footer"><button id="btn-confirm-fixed" class="btn-confirm" onclick="confirmSelection()">CONFIRMAR</button></div>
            </div>

            <div class="controls">
                <button class="btn-roll" id="btn-roll" onclick="rollDice()">¡TIRAR!</button>
                <button class="btn-score" id="btn-anotar" onclick="toggleScoreSheet(true, false)" style="display:none;">ANOTAR</button>
            </div>
        </div>
    </div>

    <div id="modal-win" class="screen">
        <div class="trophy">🏆</div>
        <h2 style="color:#f1c40f;">GANADOR</h2>
        <h1 id="winner-name" style="font-size:3rem; margin:10px 0;">JUGADOR 1</h1>
        <div id="final-score" style="font-size:1.5rem; color:#fff;">0 PUNTOS</div>
        <button class="btn" onclick="location.reload()" style="margin-top:40px;">NUEVA PARTIDA</button>
    </div>

    <script>
        const CATEGORIES = [
            { id: '1', name: 'Al 1', type: 'num', val: 1 }, { id: '2', name: 'Al 2', type: 'num', val: 2 },
            { id: '3', name: 'Al 3', type: 'num', val: 3 }, { id: '4', name: 'Al 4', type: 'num', val: 4 },
            { id: '5', name: 'Al 5', type: 'num', val: 5 }, { id: '6', name: 'Al 6', type: 'num', val: 6 },
            { id: 'E', name: 'Escalera', type: 'fixed', score: 20 }, { id: 'F', name: 'Full', type: 'fixed', score: 30 },
            { id: 'P', name: 'Poker', type: 'fixed', score: 40 }, { id: 'G', name: 'Generala', type: 'fixed', score: 50 },
            { id: 'DG', name: 'Doble G.', type: 'fixed', score: 100 }
        ];

        let state = { players: [], currentPlayer: 0, dice: [1, 1, 1, 1, 1], held: [false, false, false, false, false], rollsLeft: 3, scores: [], declaredFlips: 0, flipsPending: 0, flippedIndices: [], phase: 'select', isRolling: false, tempSelection: null, viewMode: false, isSheetOpen: false };
        let settings = { sound: true, obliged: true }; let playerCount = 1;

        const SFX = { ctx: null, init: function(){ if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }, playTone: function(freq, type) { if(!settings.sound || !this.ctx) return; try { if(this.ctx.state === 'suspended') this.ctx.resume(); const o = this.ctx.createOscillator(); const g = this.ctx.createGain(); o.type = type; o.frequency.value = freq; o.connect(g); g.connect(this.ctx.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.00001, this.ctx.currentTime + 0.3); } catch(e){} } };

        function setPlayers(n, btn) { playerCount = n; document.querySelectorAll('.p-btn').forEach(b => b.classList.remove('selected')); btn.classList.add('selected'); const c = document.getElementById('names-container'); c.innerHTML = ''; for(let i=0; i<n; i++) c.innerHTML += `<div class="name-row"><span class="name-label">J${i+1}</span><input type="text" class="name-input" id="name-${i}" value="JUGADOR ${i+1}" maxlength="12"></div>`; }
        
        function startGame() { SFX.init(); state.players = []; for(let i=0; i<playerCount; i++) state.players.push(document.getElementById(`name-${i}`).value.trim() || `JUGADOR ${i+1}`); state.scores = state.players.map(() => ({})); state.currentPlayer = 0; resetTurn(); document.getElementById('screen-home').classList.remove('active'); document.getElementById('screen-game').classList.add('active'); }
        
        function resetTurn() { state.isSheetOpen = false; state.dice = [1, 1, 1, 1, 1]; state.held = [false, false, false, false, false]; state.rollsLeft = 3; state.phase = 'select'; state.isRolling = false; state.declaredFlips = 0; state.flipsPending = 0; state.flippedIndices = []; state.tempSelection = null; state.viewMode = false; document.getElementById('flip-count').innerText = "0"; document.getElementById('player-name').innerText = state.players[state.currentPlayer]; updateUI(); renderDice(false); }
        
        function adjustFlip(delta) { if (!settings.obliged) return; let n = state.declaredFlips + delta; if(n < 0) n = 0; if(n > 5) n = 5; state.declaredFlips = n; document.getElementById('flip-count').innerText = n; }

        function rollDice() {
            if(state.rollsLeft <= 0 || state.isRolling || state.phase === 'forcing_flip') return;
            state.isRolling = true; updateUI(); SFX.playTone(200, 'square');
            const diceEls = document.querySelectorAll('.die');
            diceEls.forEach((el, i) => { if(!state.held[i]) el.classList.add('rolling'); });
            setTimeout(() => {
                state.dice = state.dice.map((val, i) => state.held[i] ? val : Math.ceil(Math.random() * 6));
                diceEls.forEach(el => el.classList.remove('rolling'));
                state.rollsLeft--; state.isRolling = false;
                if(settings.obliged && state.declaredFlips > 0) { state.phase = 'forcing_flip'; state.flipsPending = state.declaredFlips; state.flippedIndices = []; } else { state.phase = 'select'; }
                state.declaredFlips = 0; document.getElementById('flip-count').innerText = "0";
                updateUI(); renderDice(true);
            }, 500);
        }

        function flipDie(idx) {
            state.dice[idx] = 7 - state.dice[idx]; 
            SFX.playTone(600, 'triangle');
            if(state.flippedIndices.includes(idx)) { state.flippedIndices = state.flippedIndices.filter(i => i !== idx); state.flipsPending++; } else { state.flippedIndices.push(idx); state.flipsPending--; }
            if(state.flipsPending === 0) state.phase = 'select';
            updateUI(); renderDice(true);
        }

        function clickDie(idx) {
            if(state.isRolling) return;
            if(state.phase === 'forcing_flip') {
                flipDie(idx);
            } else {
                if(state.rollsLeft === 3) return; 
                state.held[idx] = !state.held[idx];
                SFX.playTone(400, 'sine');
                renderDice(true);
            }
        }

        function updateUI() {
            const btnRoll = document.getElementById('btn-roll'), btnAnotar = document.getElementById('btn-anotar'), flipArea = document.getElementById('flip-area'), msgArea = document.getElementById('msg-area'), diceZone = document.getElementById('dice-zone'), scoreSheet = document.getElementById('score-sheet'), confirmBtn = document.getElementById('btn-confirm-fixed');
            document.getElementById('rolls-info').innerText = `TIROS: ${state.rollsLeft}`;

            if (state.isSheetOpen) {
                scoreSheet.style.display = 'flex'; diceZone.style.display = 'none'; btnRoll.style.display = 'none';
                if (state.viewMode) { btnAnotar.style.display = 'block'; btnAnotar.innerText = "VOLVER"; confirmBtn.classList.remove('active'); } 
                else { btnAnotar.style.display = 'block'; btnAnotar.innerText = "VOLVER A TIRAR"; if (state.rollsLeft === 0) btnAnotar.style.display = 'none'; if (state.tempSelection) confirmBtn.classList.add('active'); else confirmBtn.classList.remove('active'); }
                return;
            } else { scoreSheet.style.display = 'none'; diceZone.style.display = 'flex'; confirmBtn.classList.remove('active'); }

            if (state.isRolling) { btnRoll.disabled = true; msgArea.innerText = "Rodando..."; msgArea.classList.remove('msg-alert'); return; }
            if (state.phase === 'forcing_flip') { btnRoll.style.display = 'none'; btnAnotar.style.display = 'none'; flipArea.style.display = 'none'; msgArea.innerText = `¡OBLIGADA! TOCA ${state.flipsPending} DADOS`; msgArea.classList.add('msg-alert'); return; }

            msgArea.classList.remove('msg-alert'); flipArea.style.display = settings.obliged ? 'flex' : 'none'; 
            if (state.rollsLeft === 3) { msgArea.innerText = settings.obliged ? "Declara vueltas y TIRA" : "Toca TIRAR para empezar"; btnRoll.style.display = 'block'; btnRoll.disabled = false; btnAnotar.style.display = 'none'; }
            else if (state.rollsLeft > 0) { msgArea.innerText = "Guarda dados o tira de nuevo"; btnRoll.style.display='block'; btnRoll.disabled=false; btnAnotar.style.display='block'; btnAnotar.innerText="ANOTAR"; }
            else { msgArea.innerText = "¡Se acabaron los tiros! Debes anotar."; btnRoll.style.display='none'; toggleScoreSheet(true, false); }
        }

        function toggleScoreSheet(forceOpen = false, isViewMode = false) {
            if (state.isSheetOpen && !forceOpen) { state.isSheetOpen = false; state.viewMode = false; state.tempSelection = null; } 
            else if (state.isSheetOpen && isViewMode && state.viewMode) { state.isSheetOpen = false; state.viewMode = false; state.tempSelection = null; } 
            else { state.isSheetOpen = true; state.viewMode = isViewMode; state.tempSelection = null; calculatePotentialScores(); document.getElementById('sheet-content').scrollTop = 0; }
            updateUI();
        }

        // GENERADOR DE DADOS ORIGINAL (RESTAURADO)
        function renderDice(interactive) {
            const rack = document.getElementById('dice-rack'); rack.innerHTML = '';
            state.dice.forEach((val, i) => {
                const die = document.createElement('div');
                const isFlippedNow = (state.phase === 'forcing_flip' && state.flippedIndices.includes(i));
                die.className = `die ${state.held[i] ? 'held' : ''} ${state.phase === 'forcing_flip' ? 'flip-target' : ''}`;
                if(isFlippedNow) die.style.opacity = "0.4"; if(interactive) die.onclick = () => clickDie(i);
                
                // Mapeo manual de puntos usando GRID COLUMN/ROW para evitar errores de CSS
                // 1 2 3
                // 4 5 6
                // 7 8 9
                let dots = '';
                if(val === 1) dots = '<div class="dot" style="grid-column:2; grid-row:2;"></div>';
                if(val === 2) dots = '<div class="dot" style="grid-column:1; grid-row:1;"></div><div class="dot" style="grid-column:3; grid-row:3;"></div>';
                if(val === 3) dots = '<div class="dot" style="grid-column:1; grid-row:1;"></div><div class="dot" style="grid-column:2; grid-row:2;"></div><div class="dot" style="grid-column:3; grid-row:3;"></div>';
                if(val === 4) dots = '<div class="dot" style="grid-column:1; grid-row:1;"></div><div class="dot" style="grid-column:3; grid-row:1;"></div><div class="dot" style="grid-column:1; grid-row:3;"></div><div class="dot" style="grid-column:3; grid-row:3;"></div>';
                if(val === 5) dots = '<div class="dot" style="grid-column:1; grid-row:1;"></div><div class="dot" style="grid-column:3; grid-row:1;"></div><div class="dot" style="grid-column:2; grid-row:2;"></div><div class="dot" style="grid-column:1; grid-row:3;"></div><div class="dot" style="grid-column:3; grid-row:3;"></div>';
                if(val === 6) dots = '<div class="dot" style="grid-column:1; grid-row:1;"></div><div class="dot" style="grid-column:3; grid-row:1;"></div><div class="dot" style="grid-column:1; grid-row:2;"></div><div class="dot" style="grid-column:3; grid-row:2;"></div><div class="dot" style="grid-column:1; grid-row:3;"></div><div class="dot" style="grid-column:3; grid-row:3;"></div>';
                
                die.innerHTML = dots;
                rack.appendChild(die);
            });
        }

        function calculatePotentialScores() {
            const counts = {}; state.dice.forEach(x => counts[x] = (counts[x] || 0) + 1); const vals = Object.values(counts); const isServida = (state.rollsLeft === 2); 
            document.getElementById('sheet-title').innerText = state.players[state.currentPlayer]; const content = document.getElementById('sheet-content'); let html = "";
            CATEGORIES.forEach(cat => {
                const currentScore = state.scores[state.currentPlayer][cat.id]; let potential = 0; let canScore = false;
                if (currentScore === undefined) {
                    if (cat.type === 'num') { potential = (counts[cat.val] || 0) * cat.val; canScore = true; } 
                    else {
                        if (cat.id === 'E') { const s = [...state.dice].sort((a,b)=>a-b).join(''); if(s === '12345' || s === '23456' || s === '13456') { potential = cat.score + (isServida ? 5 : 0); canScore = true; } }
                        else if (cat.id === 'F') { if ((vals.includes(3) && vals.includes(2)) || vals.includes(5)) { potential = cat.score + (isServida ? 5 : 0); canScore = true; } }
                        else if (cat.id === 'P') { if (vals.includes(4) || vals.includes(5)) { potential = cat.score + (isServida ? 5 : 0); canScore = true; } }
                        else if (cat.id === 'G') { if (vals.includes(5)) { potential = cat.score + (isServida ? 5 : 0); canScore = true; } }
                        else if (cat.id === 'DG') { if (state.scores[state.currentPlayer]['G'] && vals.includes(5)) { potential = cat.score; canScore = true; } }
                    }
                    let btnClass = 'cat-btn selectable'; if (state.viewMode) btnClass = 'cat-btn disabled'; if (state.tempSelection && state.tempSelection.id === cat.id) btnClass = 'cat-btn selected-candidate';
                    const valToShow = (canScore && potential > 0) ? potential : 'X'; const scoreToSave = (canScore && potential > 0) ? potential : 0;
                    btnHtml = `<button class="${btnClass}" onclick="selectScore('${cat.id}', ${scoreToSave})">${valToShow}</button>`;
                } else { btnHtml = `<span class="cat-btn filled">${currentScore}</span>`; }
                html += `<div class="score-row"><span class="cat-name">${cat.name}</span>${btnHtml}</div>`;
            }); content.innerHTML = html;
        }

        function selectScore(catId, score) { if (state.viewMode) return; SFX.playTone(400, 'sine'); state.tempSelection = { id: catId, score: score }; calculatePotentialScores(); updateUI(); }
        function confirmSelection() { if (!state.tempSelection) return; SFX.playTone(800, 'triangle'); state.scores[state.currentPlayer][state.tempSelection.id] = state.tempSelection.score; const totalSlots = CATEGORIES.length * state.players.length; let currentTotalFilled = 0; state.scores.forEach(s => currentTotalFilled += Object.keys(s).length); state.currentPlayer++; if(state.currentPlayer >= state.players.length) state.currentPlayer = 0; if(currentTotalFilled >= totalSlots) endGame(); else resetTurn(); }
        function endGame() { let maxScore = -1; let winner = ""; state.players.forEach((p, i) => { let total = Object.values(state.scores[i]).reduce((a,b)=>a+b, 0); if(total > maxScore) { maxScore = total; winner = p; } }); document.getElementById('screen-game').classList.remove('active'); document.getElementById('modal-win').classList.add('active'); document.getElementById('winner-name').innerText = winner; document.getElementById('final-score').innerText = maxScore + " PUNTOS"; }
    </script>
</body>
</html>
